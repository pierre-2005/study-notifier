# Portainer Web Editor stack. Build the image ON THE DOCKER HOST first:
# docker build -t mlo-next:v3-preview .
# Find the existing database volume with: docker volume ls
# Set MLO_DB_VOLUME_NAME to the EXACT existing volume name in Portainer.
services:
  mlo:
    image: mlo-next:v3-preview
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set a long random SESSION_SECRET}
      APP_USERNAME: ${APP_USERNAME:?Set admin username}
      APP_PASSWORD: ${APP_PASSWORD:?Set admin password}
      STUDY_NOTIFIER_DB: /data/study_notifier.db
      MLO_ATTACHMENT_DIR: /data/mlo_uploads
      TIMEZONE: ${TIMEZONE:-America/Edmonton}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NOTIFIER: ntfy
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
    volumes:
      - mlo_existing_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  mlo_existing_data:
    external: true
    name: ${MLO_DB_VOLUME_NAME:?Set the exact pre-existing Docker volume name}
