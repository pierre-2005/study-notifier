name: Build and publish MLO Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install app and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'httpx>=0.27,<1'
          python -c 'import httpx; print("httpx version:", httpx.__version__)'

      - name: Compile Python modules
        run: python -m compileall -q app
      - name: Test core routes, security and accounts
        run: python tests_smoke.py
      - name: Test imports, files and devices
        run: python tests_new_features.py
      - name: Test legacy data migration
        run: python tests_migration.py
      - name: Test module consolidation
        run: python tests_consolidation.py
      - name: Test Studio v3.2 functionality
        run: python tests_v32.py
      - name: Test Studio v3.4 functionality
        run: python tests_v34.py

  publish:
    name: Publish multi-architecture Docker image
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish AMD64 / ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/pierre-2005/study-notifier:v3.4-enhanced
