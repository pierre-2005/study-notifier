name: Build and publish MLO Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    name: Verify release
    uses: ./.github/workflows/validation.yml
    permissions:
      contents: read
      actions: read


  publish:
    name: Publish multi-architecture Docker image
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish AMD64 / ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
          tags: ghcr.io/pierre-2005/study-notifier:v4.0.0
