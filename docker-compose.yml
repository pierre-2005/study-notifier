services:
  study_notifier:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      NOTIFIER: ntfy
      TIMEZONE: America/Edmonton
      NTFY_BASE_URL: https://ntfy.sh
      NTFY_TOPIC: study-9f3a2c1d4e6b7a8f
      STUDY_NOTIFIER_DB: /data/study_notifier.db
      SESSION_SECRET: hj435gh3g545hjv4332ll5k436k3khv4kj234v235
      APP_USERNAME: Pierre
      APP_PASSWORD: "Pero@MLO-212005"
      COOKIE_SECURE: "true"
    volumes:
      - study_notifier_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.getaddrinfo('ntfy.sh', 443)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  study_notifier_data:
