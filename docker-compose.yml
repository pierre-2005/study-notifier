services:
  study_notifier:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      NOTIFIER: ntfy
      TIMEZONE: America/Edmonton
      NTFY_BASE_URL: https://ntfy.sh
      NTFY_TOPIC: ${NTFY_TOPIC}
      STUDY_NOTIFIER_DB: /data/study_notifier.db
      SESSION_SECRET: ${SESSION_SECRET}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      COOKIE_SECURE: "true"
    volumes:
      - study_notifier_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.getaddrinfo('ntfy.sh', 443)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  study_notifier_data:
