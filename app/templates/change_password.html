{% extends 'base.html' %}{% block content %}<section class="card login-card"><div class="login-brand-row"><span class="workspace-icon">M</span><div><div class="eyebrow">Account security</div><h1>Change password</h1></div></div>
{% if required %}<div class="login-error" role="alert">Your administrator issued a temporary password. Change it before continuing.</div>{% endif %}
<form method="post" action="/account/password" class="login-form"><label class="field"><span class="label">Current password</span><input type="password" name="current_password" autocomplete="current-password" required class="input"></label><label class="field"><span class="label">New password (12+ characters)</span><input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="256" required class="input"></label><label class="field"><span class="label">Confirm new password</span><input type="password" name="confirm" autocomplete="new-password" minlength="12" maxlength="256" required class="input"></label><button class="btn btn-primary login-submit">Save new password</button></form>
{% if error %}<div class="login-error" role="alert">{{error}}</div>{% endif %}</section>{% endblock %}
