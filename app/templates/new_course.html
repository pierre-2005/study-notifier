{% extends "base.html" %}
{% block content %}

<div class="card p-6 max-w-2xl">
  <div class="flex items-center justify-between">
    <h2 class="text-lg font-extrabold">New Course</h2>
    <a class="btn" href="/courses">Back</a>
  </div>

  <form method="post" class="mt-5 space-y-4">
    <div>
      <div class="label">Name</div>
      <input class="input" name="name" required placeholder="ENEL 419" />
    </div>

    <div>
      <div class="label">Term (optional)</div>
      <input class="input" name="term" placeholder="Winter 2026" />
    </div>

    <div>
      <div class="label">Color (optional)</div>
      <input class="input" name="color" placeholder="#4f46e5" />
      <div class="muted mt-1">Tip: paste any hex color (e.g., #22c55e).</div>
    </div>

    <div class="flex gap-2">
      <button class="btn btn-primary" type="submit">Create</button>
      <a class="btn" href="/courses">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
