{% extends "base.html" %}
{% block content %}

<div class="card p-6 max-w-2xl">
  <div class="flex items-center justify-between">
    <h2 class="text-2xl font-extrabold">New course</h2>
    <a class="btn" href="/courses">Back</a>
  </div>

  <form method="post" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="md:col-span-2">
      <div class="label">Course name</div>
      <input class="input" name="name" required placeholder="ENEL 419" />
    </div>

    <div>
      <div class="label">Term (optional)</div>
      <input class="input" name="term" placeholder="Winter 2026" />
    </div>

    <div>
      <div class="label">Color (optional)</div>
      <input class="input" name="color" placeholder="#4f46e5" />
      <div class="muted mt-1">Tip: use a hex code like <span class="kbd">#4f46e5</span></div>
    </div>

    <div class="md:col-span-2 flex gap-2">
      <button class="btn btn-primary" type="submit">Create</button>
      <a class="btn" href="/courses">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
