<div class="task-map" data-task-map data-project-id="{{project.id}}">
<script type="application/json" data-map-initial>{{map_data|tojson}}</script>
<div class="task-map-toolbar"><div class="task-map-tools"><label class="task-map-search"><span class="sr-only">Find a task in this map</span><input type="search" data-map-search placeholder="Find a task…" autocomplete="off"></label><button class="mlo-btn mlo-secondary" type="button" data-map-fit>Fit map</button><button class="mlo-btn mlo-secondary" type="button" data-map-arrange>Arrange</button>{% if project.my_role!='viewer' %}<button class="mlo-btn mlo-primary" type="button" data-map-add>Add task</button>{% endif %}</div><div class="task-map-zoom" role="group" aria-label="Map zoom"><button type="button" data-map-zoom="-1" aria-label="Zoom out">−</button><output data-map-scale>100%</output><button type="button" data-map-zoom="1" aria-label="Zoom in">+</button></div></div>
<p class="task-map-help">Drag the canvas to move around. Drag a task to arrange it. <span class="task-map-legend-parent">Subtasks</span><span class="task-map-legend-dependency">Prerequisites</span></p>
<div class="task-map-viewport" data-map-viewport tabindex="0" role="region" aria-label="Project task map. Use arrow keys to pan; plus and minus to zoom. Select a task to edit its relationships."><div class="task-map-world" data-map-world><svg class="task-map-lines" data-map-lines aria-hidden="true"><defs><marker id="task-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="currentColor"/></marker></defs></svg><div data-map-nodes></div></div><p class="task-map-empty" data-map-empty hidden>No tasks yet. Add your first task to start the map.</p></div>
<div class="task-map-selection" data-map-selection hidden><div><strong data-map-selected-title></strong><span data-map-selected-status></span></div><div class="task-map-tools"><button class="mlo-btn mlo-secondary" type="button" data-map-open>Open task</button>{% if project.my_role!='viewer' %}<button class="mlo-btn mlo-secondary" type="button" data-map-child>Add subtask</button><button class="mlo-btn mlo-secondary" type="button" data-map-relate>Relationships</button><button class="mlo-btn mlo-secondary" type="button" data-map-earlier>Earlier</button><button class="mlo-btn mlo-secondary" type="button" data-map-later>Later</button>{% endif %}</div></div>
<div class="task-map-footer"><p data-map-status role="status" aria-live="polite">Layout saves to your account.</p><button type="button" class="mlo-link-btn" data-map-retry hidden>Retry layout save</button></div><noscript><p>Use the List view to work with tasks without JavaScript.</p><a class="mlo-text-link" href="/life/projects/{{project.id}}?view=list">Open task list</a></noscript>
</div><script src="/static/task-map.js?v={{APP_VERSION}}" defer></script>
