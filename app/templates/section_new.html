{% extends "base.html" %}
{% block content %}
<div class="finance-back-row"><a class="back-link" href="/sections">← All sections</a></div>
<div class="page-heading"><div><div class="eyebrow">Create a space</div><h1>New section</h1><p>Use sections for flexible information; use Projects when the work has milestones and a finish line.</p></div></div>
<form method="post" action="/sections/new" class="card section-create-card"><div class="card-b space-y-5">
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4"><label class="field sm:col-span-2"><span class="label">Section name</span><input class="input input-lg" name="name" placeholder="e.g. Personal HQ, Team notes, Apartment groceries" maxlength="100" required autofocus></label><label class="field"><span class="label">Icon</span><select class="input" name="icon">{% for icon in section_icons %}<option value="{{ icon }}">{{ icon }}</option>{% endfor %}</select></label></div>
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4"><label class="field"><span class="label">Category</span><select class="input" name="category">{% for category in section_categories %}<option>{{ category }}</option>{% endfor %}</select></label><label class="field"><span class="label">Accent</span><input class="input color-input" type="color" name="color" value="#5b7cfa"></label><label class="field"><span class="label">Description</span><input class="input" name="description" maxlength="500" placeholder="What belongs here?"></label></div>
  <div><div class="label mb-2">Template</div><div class="template-choice-grid"><label class="template-choice"><input type="radio" name="section_type" value="blank" checked><div class="template-choice-icon">📄</div><strong>Flexible section</strong><small>Notes and a collaborative checklist. Ideal for personal, study, work, home, and club spaces.</small></label><label class="template-choice"><input type="radio" name="section_type" value="grocery"><div class="template-choice-icon">🛒</div><strong>Grocery & Meals</strong><small>Shopping list, item library, recipes, recipe-to-list actions, purchase history, and price comparison.</small></label></div></div>
  <div class="hstack"><button class="btn btn-primary" type="submit">Create section</button><a class="btn" href="/sections">Cancel</a></div>
</div></form>
{% endblock %}
