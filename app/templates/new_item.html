{% extends "base.html" %}
{% block content %}

<div class="card" style="max-width: 860px; margin: 0 auto;">
  <div class="card-h">
    <div>
      <div class="h1">New item</div>
      <div class="muted" style="margin-top:4px;">Create an assignment, exam, or lab (and optionally auto-add reminders).</div>
    </div>
    <a class="btn" href="/items">Back</a>
  </div>

  <div class="card-b">
    <form method="post">
      <div class="toolbar">
        <div>
          <div class="label">Course</div>
          <select class="select" name="course_id" required>
            {% for c in courses %}
              <option value="{{ c['id'] }}">{{ c["name"] }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <div class="label">Type</div>
          <select class="select" name="type" required>
            <option value="assignment">Assignment</option>
            <option value="exam">Exam</option>
            <option value="lab">Lab</option>
          </select>
        </div>

        <div style="grid-column: 1 / -1;">
          <div class="label">Title</div>
          <input class="input" name="title" required placeholder="Lab 3 report / Midterm / Problem set…" />
        </div>

        <div style="grid-column: 1 / -1;">
          <div class="label">Notes (optional)</div>
          <textarea class="textarea" name="notes" rows="3" placeholder="Anything you want to remember…"></textarea>
        </div>

        <div>
          <div class="label">Due date/time (local)</div>
          <input class="input" type="datetime-local" name="due_at_local" required />
        </div>

        <div>
          <div class="label">Priority (1–5)</div>
          <input class="input" type="number" name="priority" min="1" max="5" value="2" />
        </div>

        <div>
          <div class="label">Weight (optional)</div>
          <input class="input" name="weight" placeholder="e.g. 10" />
        </div>

        <div class="hstack" style="align-items:center; gap:10px; grid-column: 1 / -1;">
          <input type="hidden" name="auto_template" value="off">
          <input id="auto_template" type="checkbox" name="auto_template" value="on" checked>
          <label for="auto_template" class="muted">Auto-add reminder template</label>
        </div>

        <div class="actions" style="grid-column: 1 / -1;">
          <button class="btn btn-primary" type="submit">Create</button>
          <a class="btn" href="/items">Cancel</a>
        </div>

        <div class="muted" style="grid-column: 1 / -1;">
          Templates are editable in <a href="/settings" style="text-decoration:underline; color:inherit;">Settings</a>.
        </div>
      </div>
    </form>
  </div>
</div>

{% endblock %}
