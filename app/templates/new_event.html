{% extends "base.html" %}
{% block content %}
<div class="card p-5">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <div class="text-xl font-extrabold">MLO-only event</div>
      <div class="muted mt-1">This saves only in MLO and does not create a Google or Outlook event.</div>
    </div>
    <a class="btn" href="/life/calendars/new">Choose another calendar</a>
  </div>
</div>

<div class="mt-6 card p-5">
  <form method="post" action="/events/new" class="space-y-5">
    <div>
      <div class="label mb-2">Title</div>
      <input class="input" name="title" placeholder="Team meeting" required />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <div class="label mb-2">Kind</div>
        <select class="input" name="kind">
          <option value="meeting" selected>Meeting</option>
          <option value="personal">Personal</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div>
        <div class="label mb-2">Location (optional)</div>
        <input class="input" name="location" placeholder="Zoom / Room / Address" />
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <div class="label mb-2">Start (local)</div>
        <input class="input" type="datetime-local" name="start_at_local" required />
        <div class="muted mt-2">Timezone: {{ tz }}</div>
      </div>

      <div>
        <div class="label mb-2">End (local, optional)</div>
        <input class="input" type="datetime-local" name="end_at_local" />
      </div>
    </div>

    <div>
      <div class="label mb-2">Notes (optional)</div>
      <textarea class="input" name="notes" rows="4" placeholder="Agenda, link, who’s coming…"></textarea>
    </div>

    <div class="flex flex-wrap gap-2">
      <button class="btn btn-primary" type="submit">Save to MLO only</button>
      <a class="btn" href="/events">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
