{% extends "base.html" %}
{% block content %}

<div class="card p-6 max-w-2xl">
  <div class="flex items-center justify-between">
    <h2 class="text-lg font-extrabold">New Event</h2>
    <a class="btn" href="/events">Back</a>
  </div>

  <form method="post" class="mt-5 grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="md:col-span-2">
      <div class="label">Title</div>
      <input class="input" name="title" required placeholder="Club meeting / Office hours / Appointment" />
    </div>

    <div>
      <div class="label">Kind</div>
      <select class="input" name="kind">
        <option value="meeting">meeting</option>
        <option value="personal">personal</option>
        <option value="other">other</option>
      </select>
    </div>

    <div>
      <div class="label">Location (optional)</div>
      <input class="input" name="location" placeholder="ENGG / Zoom / etc." />
    </div>

    <div>
      <div class="label">Start</div>
      <input class="input" type="datetime-local" name="start_at_local" required />
    </div>

    <div>
      <div class="label">End (optional)</div>
      <input class="input" type="datetime-local" name="end_at_local" />
    </div>

    <div class="md:col-span-2">
      <div class="label">Notes</div>
      <textarea class="input" name="notes" rows="3"></textarea>
    </div>

    <div class="md:col-span-2 flex gap-2">
      <button class="btn btn-primary" type="submit">Create</button>
      <a class="btn" href="/events">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
