<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ title if title else "My Life Organized" }}</title>

  <link rel="icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

  <!-- Set theme ASAP to avoid flash -->
  <script>
    (function () {
      try {
        const stored = localStorage.getItem("theme") || "light"; // "light" | "dark"
        document.documentElement.classList.toggle("dark", stored === "dark");
      } catch (e) {}
    })();
  </script>

  <!-- Your theme tokens + components -->
  <link rel="stylesheet" href="/static/theme.css">
  <script src="/static/theme.js" defer></script>

  <!-- Keep Tailwind so older pages/templates still work -->
  <script>
    tailwind = window.tailwind || {};
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Small helper styling for active nav button -->
  <style>
    .nav a.active {
      background: var(--panel2);
      border: 1px solid var(--border);
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">
          <span style="font-size:16px;">📌</span>
          <span>My Life Organized</span>
        </div>
        <div class="small" style="margin-top:2px;">
          Assignments, Exams, Job applications, Expenses and Schedule
        </div>
      </div>

      <div class="hstack">
        <button id="themeToggle" class="btn" type="button" aria-label="Toggle theme">
          🌙 <span class="hidden sm:inline">Dark</span>
        </button>
      </div>
    </div>

    {% set p = request.url.path %}
    <div class="topbar-inner" style="padding-top:0; padding-bottom:12px;">
      <div class="nav">
        <a class="{{ 'active' if p=='/' else '' }}" href="/">Dashboard</a>
        <a class="{{ 'active' if p.startswith('/courses') else '' }}" href="/courses">Courses</a>
        <a class="{{ 'active' if p.startswith('/items') else '' }}" href="/items">Assignments/Exams</a>
        <a class="{{ 'active' if p.startswith('/jobs') else '' }}" href="/jobs">Jobs</a>
        <a class="{{ 'active' if p.startswith('/expenses') else '' }}" href="/expenses">Expenses</a>
        <a class="{{ 'active' if (p.startswith('/schedule') or p.startswith('/classes') or p.startswith('/events')) else '' }}" href="/schedule">Schedule</a>
      </div>
    </div>
  </div>

  <div class="container">
    {% block content %}{% endblock %}

    <div style="margin-top:28px; text-align:center;" class="small">
      My Life Organized <span style="font-weight:800;">v{{ APP_VERSION }}</span>
    </div>
  </div>

  <script>
    function applyTheme(theme) {
      document.documentElement.classList.toggle("dark", theme === "dark");
      localStorage.setItem("theme", theme);
      renderThemeButton();
    }

    function currentTheme() {
      return document.documentElement.classList.contains("dark") ? "dark" : "light";
    }

    function renderThemeButton() {
      const btn = document.getElementById("themeToggle");
      if (!btn) return;
      const t = currentTheme();

      btn.innerHTML = (t === "dark")
        ? `☀️ <span class="hidden sm:inline">Light</span>`
        : `🌙 <span class="hidden sm:inline">Dark</span>`;
    }

    document.addEventListener("DOMContentLoaded", function () {
      renderThemeButton();
      const btn = document.getElementById("themeToggle");
      if (btn) {
        btn.addEventListener("click", function () {
          applyTheme(currentTheme() === "dark" ? "light" : "dark");
        });
      }
    });
  </script>
</body>
</html>
