{% extends "base.html" %}
{% block content %}

<div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
  <div>
    <h2 class="text-2xl font-extrabold">{{ course["name"] }}</h2>
    <p class="muted">{{ course["term"] or "" }}</p>
  </div>

  <div class="flex gap-2">
    <a class="btn btn-primary" href="/items/new">+ Add assignment/exam</a>
    <form method="post" action="/courses/{{ course['id'] }}/delete"
          onsubmit="return confirm('Delete this course AND all items/reminders inside it?');">
      <button class="btn btn-danger" type="submit">Delete course</button>
    </form>
  </div>
</div>

<div class="card p-5 mt-6">
  <h3 class="text-lg font-bold mb-3">Items</h3>
  <table class="table w-full">
    <tr><th>Due</th><th>Type</th><th>Title</th><th>Status</th></tr>
    {% for it in items %}
    <tr>
      <td>{{ utc_to_local_str(it["due_at_utc"], tz) }}</td>
      <td><span class="pill">{{ it["type"] }}</span></td>
      <td><a class="link" href="/items/{{ it['id'] }}">{{ it["title"] }}</a></td>
      <td>{{ it["status"] }}</td>
    </tr>
    {% endfor %}
  </table>
</div>

{% endblock %}
