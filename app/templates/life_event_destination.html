{% extends 'base.html' %}
{% block content %}
<div class="mlo-space mlo-area-page">
  <div class="mlo-page-head">
    <div><div class="mlo-kicker">CALENDAR</div><h1>New event</h1><p>Create an event in MLO or a connected calendar.</p></div>
    <a href="/life/calendar" class="mlo-btn mlo-secondary">← Calendar</a>
  </div>
  <section class="mlo-surface mlo-event-editor">
    <form class="mlo-form" method="post" action="/life/calendars/new" id="mlo-unified-event-form">
      <label>Save to
        <select name="destination" id="mlo-event-destination" required>
          <option value="mlo">MLO only</option>
          {% for c in connections %}
          <option value="external:{{c.id}}" {% if not c.can_edit %}disabled{% endif %}>
            {{c.label}} ({{'Google' if c.provider=='google' else 'Outlook'}}){% if not c.can_edit %} · Reconnect to edit{% endif %}
          </option>
          {% endfor %}
        </select>
      </label>
      <label id="mlo-event-calendar-wrap" hidden>Calendar
        <select name="calendar_id" id="mlo-event-calendar"></select>
      </label>
      <div class="mlo-subtle" role="status" aria-live="polite" id="mlo-event-calendar-status"></div>
      <label>Title<input type="text" name="title" maxlength="220" required autofocus placeholder="Appointment, meeting or class"></label>
      <div class="mlo-event-date-row">
        <label>Start<input type="datetime-local" name="start" required></label>
        <label>End<input type="datetime-local" name="end" required></label>
      </div>
      <div id="mlo-event-local-options">
        <div class="mlo-event-date-row">
          <label>Category<select name="kind"><option value="meeting">Meeting</option><option value="personal">Personal</option><option value="other">Other</option></select></label>
          <label>Location<input type="text" name="location" maxlength="240" placeholder="Optional"></label>
        </div>
        <label>Notes<textarea name="notes" rows="3" placeholder="Optional"></textarea></label>
      </div>
      <p class="mlo-subtle" id="mlo-event-help">MLO-only events are stored on your MLO server. Connected events are saved to the chosen provider.</p>
      <div class="mlo-inline-actions">
        <button type="submit" class="mlo-btn mlo-primary" id="mlo-event-submit">Create event</button>
        <a href="/life/calendars" class="mlo-btn mlo-secondary">Manage calendar accounts</a>
      </div>
    </form>
  </section>
</div>
<script>
(() => {
  const destination=document.getElementById('mlo-event-destination');
  const calendar=document.getElementById('mlo-event-calendar');
  const wrap=document.getElementById('mlo-event-calendar-wrap');
  const status=document.getElementById('mlo-event-calendar-status');
  const submit=document.getElementById('mlo-event-submit');
  const localOptions=document.getElementById('mlo-event-local-options');
  const help=document.getElementById('mlo-event-help');
  if (!destination || !calendar) return;
  let seq=0;
  async function refresh() {
    const selection=destination.value;
    const current=++seq;
    const external=selection.startsWith('external:');
    wrap.hidden=!external;
    localOptions.hidden=external;
    calendar.required=external;
    calendar.replaceChildren();
    status.textContent='';
    help.textContent=external ? 'This event will be written to the selected external calendar and displayed in MLO.' : 'This event will be stored in MLO only.';
    if (!external) { submit.disabled=false; return; }
    submit.disabled=true;
    status.textContent='Loading calendars…';
    try {
      const id=selection.slice(9);
      const response=await fetch('/life/calendars/'+encodeURIComponent(id)+'/calendars.json',{credentials:'same-origin'});
      if(!response.ok)throw new Error(response.status===409 ? 'Reconnect this account to enable editing.' : 'Unable to load calendars. Check the connection.');
      const data=await response.json();
      if(current!==seq)return;
      for(const item of data.calendars || []) {
        const option=document.createElement('option');
        option.value=item.id;
        option.textContent=item.name;
        calendar.append(option);
      }
      if(!calendar.options.length)throw new Error('No writable calendars are available in this account.');
      status.textContent='';
      submit.disabled=false;
    } catch(e) {
      if(current!==seq)return;
      status.textContent=e.message || 'Unable to load calendars.';
      submit.disabled=true;
    }
  }
  destination.addEventListener('change',refresh);
  refresh();
})();
</script>
{% endblock %}
