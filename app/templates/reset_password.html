{% extends 'base.html' %}{% block content %}<section class="card login-card"><div class="login-brand-row"><span class="workspace-icon">M</span><div><div class="eyebrow">Account recovery</div><h1>Reset password</h1></div></div>
{% if valid %}<form method="post" class="login-form"><label class="field"><span class="label">New password</span><input type="password" class="input" name="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><label class="field"><span class="label">Confirm new password</span><input type="password" class="input" name="confirm" minlength="12" maxlength="256" autocomplete="new-password" required></label><button class="btn btn-primary login-submit">Reset password</button></form>{% else %}<p class="muted">This password-reset link has expired or has already been used. Request another link.</p>{% endif %}
{% if error %}<div class="login-error" role="alert">{{error}}</div>{% endif %}<div class="login-alt"><a href="/forgot-password">Request another link</a></div></section>{% endblock %}
