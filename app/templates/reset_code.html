{% extends 'base.html' %}{% block content %}
<section class="card login-card">
  <div class="login-brand-row"><span class="workspace-icon" aria-hidden="true">M</span><h1>Reset your password</h1></div>
  <p class="muted">Enter the six-digit code sent to your verified email.</p>
  <form method="post" class="login-form">
    <label class="field">Email<input class="input" name="email" type="email" autocomplete="email" required maxlength="254"></label>
    <label class="field">Reset code<input class="input code-input" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label>
    <label class="field">New password<input class="input" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
    <label class="field">Confirm password<input class="input" name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
    <button class="btn btn-primary" type="submit">Update password</button>
  </form>
  {% if error %}<p class="login-error" role="alert">{{error}}</p>{% endif %}
  <div class="login-alt"><a href="/forgot-password">Request another code</a> · <a href="/login">Sign in</a></div>
</section>
{% endblock %}
