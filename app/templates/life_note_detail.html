{% extends 'base.html' %}{% block content %}<div class="mlo-space"><a href="/life/notes" class="mlo-back">← All notes</a><div class="mlo-page-head"><div><div class="mlo-kicker">NOTE / {{note.area|upper}}</div><h1>{{note.title}}</h1><p>Last edited {{note.updated_at[:10]}}</p></div></div><section class="mlo-surface mlo-editor"><form action="/life/notes/{{note.id}}/edit" method="post" class="mlo-form"><label>Title<input name="title" value="{{note.title}}" required></label><label>Contents<textarea name="body" rows="21" placeholder="Just start writing…">{{note.body}}</textarea></label><button class="mlo-btn mlo-primary">Save note</button></form></section><section class="mlo-surface mlo-editor"><h2>Attachments</h2>{% for file in attachments %}<a class="mlo-small-project" href="/life/files/{{file.id}}">↓ {{file.filename}}</a>{% else %}<p class="mlo-subtle">No attachments yet.</p>{% endfor %}<form class="mlo-form" method="post" action="/life/files/upload" enctype="multipart/form-data"><input type="hidden" name="note_id" value="{{note.id}}"><label>Attach a file (up to 10 MB)<input type="file" name="file" required></label><button class="mlo-btn mlo-secondary">Upload file</button></form></section><form method="post" action="/life/notes/{{note.id}}/delete" onsubmit="return confirm('Delete this note?')"><button class="mlo-btn mlo-danger">Delete note</button></form></div>{% endblock %}
